limit: 2000
memory_size: 0x400
memory_mapped_io:
  0x80: [10]
  0x84: []
reports:
  - name: trace
    slice: all
    view: |
      {pc}: {instruction} {pc:label}
      a0={A0:dec} a1={A1:dec} sp={Sp:hex} ra={Ra:hex}
  - name: result
    slice: last
    view: |
      numio[0x80]: {io:0x80:dec}
      numio[0x84]: {io:0x84:dec}
    assert: |
      numio[0x80]: [] >>> []
      numio[0x84]: [] >>> [55]
